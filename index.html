<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amos Adeyemo — Video</title>
  <meta name="description" content="A short video message from Amos Adeyemo." />
  <meta property="og:title" content="Amos Adeyemo — Video" />
  <meta property="og:description" content="A short video message from Amos Adeyemo." />
  <meta property="og:type" content="video.other" />
  <meta property="og:image" content="/public/poster.jpg" />
  <meta property="og:video" content="/public/video.mp4" />
  <meta property="og:video:type" content="video/mp4" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" as="image" href="/public/poster.jpg" />
  <style>
    :root {
      --bg: #0e0f12;
      --fg: #f3f1ec;
      --muted: #9a978f;
      --accent: #e8b86d;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(232, 184, 109, 0.12), transparent 60%),
        var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px, 5vh, 56px) 16px 32px;
      gap: 24px;
    }
    header { text-align: center; max-width: 560px; }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
    }
    .player {
      position: relative;
      width: min(420px, 100%, calc((100vh - 220px) * 9 / 16));
      min-width: 260px;
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 30px 80px -20px rgba(0, 0, 0, 0.8),
        0 0 120px -40px rgba(232, 184, 109, 0.35);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45), transparent 50%);
      border: 0;
      cursor: pointer;
      transition: opacity 0.25s;
    }
    .play span {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: grid; place-items: center;
      transition: transform 0.2s;
    }
    .play:hover span { transform: scale(1.06); }
    .play svg { margin-left: 5px; }
    .player.started .play { opacity: 0; pointer-events: none; }
    footer { color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Video message</p>
    <h1>Amos Adeyemo</h1>
  </header>

  <div class="player" id="player">
    <video id="video" src="/public/video.mp4" poster="/public/poster.jpg" playsinline preload="metadata"></video>
    <button class="play" id="play" aria-label="Play video">
      <span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#111" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </span>
    </button>
  </div>

  <footer>2:00 · <a href="/public/video.mp4" download>Download</a></footer>

  <script>
    const player = document.getElementById("player");
    const video = document.getElementById("video");
    document.getElementById("play").addEventListener("click", () => {
      player.classList.add("started");
      video.controls = true;
      video.play();
    });
  </script>
</body>
</html>
